<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalogue — SLSD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<main class="w"><section style="padding-top:34px">
<h1 style="font-size:clamp(30px,5vw,54px)">Catalogue</h1>
<form class="sbox" id="sf" style="margin-top:18px"><input id="q" type="search" placeholder="Que cherchez-vous ?" aria-label="Recherche"><button class="btn p lg" type="submit">Chercher</button></form>
<div class="tabs" id="tabs"><button data-t="" class="on">Tout</button><button data-t="produit">Produits</button><button data-t="service">Services</button><button data-t="talent">Professionnels</button></div>
<p class="mute" id="sm"></p>
<div class="grid" id="gr"></div>
</section></main>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
var st = { q: SLSD.param("q"), t: SLSD.param("t"), u: SLSD.param("u") };
SLSD.layout(st.t);
document.getElementById("q").value = st.q;
function render() {
  var list = SLSD.search(st.q);
  if (st.t) list = list.filter(function (x) { return x.t === st.t; });
  if (st.u) list = list.filter(function (x) { return x.u === st.u; });
  document.getElementById("gr").innerHTML = list.length ? list.map(SLSD.card).join("")
    : '<div class="emp"><b>Aucune offre pour l\'instant.</b><br>Bientôt, vous pourrez publier votre demande et les vendeurs vous répondront.</div>';
  var sm = document.getElementById("sm");
  sm.textContent = list.length + " offre" + (list.length > 1 ? "s" : "") + (st.u ? " · " + st.u : "") + (st.q ? " · « " + st.q + " »" : "");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) { b.classList.toggle("on", b.getAttribute("data-t") === st.t); });
}
document.getElementById("sf").addEventListener("submit", function (e) { e.preventDefault(); st.q = document.getElementById("q").value; st.u = ""; render(); });
document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { st.t = b.getAttribute("data-t"); render(); } });
render();
</script>
</body>
</html>
