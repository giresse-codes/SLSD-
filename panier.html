<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panier — SLSD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<main class="w"><section style="padding-top:34px">
<h1 style="font-size:clamp(30px,5vw,54px)">Panier</h1>
<div id="lst" style="margin-top:20px"></div>
<div id="pay-zone"></div>
</section></main>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
SLSD.layout("");
function render() {
  var items = SLSD.cart.items(), z = document.getElementById("lst");
  if (!items.length) { z.innerHTML = '<div class="emp">Votre panier est vide. <a href="catalogue.html">Voir le catalogue</a></div>'; document.getElementById("pay-zone").innerHTML = ""; return; }
  z.innerHTML = items.map(function (x, i) {
    return '<div class="ln"><span>' + x.n + '<br><small class="mute">' + x.s + ' · ' + x.c + '</small></span><span>' + SLSD.fmt(x.p) + '<br><button class="btn" data-rm="' + i + '" type="button" style="padding:4px 10px;font-size:13px">Retirer</button></span></div>';
  }).join("") + '<div class="ln"><b>Total</b><b>' + SLSD.fmt(SLSD.cart.total()) + '</b></div>';
  document.getElementById("pay-zone").innerHTML = '<button class="btn p lg" id="pay" type="button" style="margin-top:20px;width:100%">Payer en séquestre</button><p class="note">Simulation : aucun paiement réel. Le vrai paiement Mobile Money sera branché à l\'étape suivante.</p>';
  document.getElementById("pay").onclick = pay;
}
document.getElementById("lst").addEventListener("click", function (e) {
  var b = e.target.closest("[data-rm]"); if (b) { SLSD.cart.remove(Number(b.getAttribute("data-rm"))); render(); }
});
function pay() {
  SLSD.auth.current().then(function (u) {
    if (!u) { location.href = "connexion.html?next=panier.html"; return; }
    var labels = ["Paiement reçu et bloqué sur SLSD", "Le vendeur prépare et expédie", "Vous confirmez la réception", "Le vendeur est payé"];
    var n = 1;
    function draw() {
      document.getElementById("lst").innerHTML = '<div class="stp">' + labels.map(function (l, i) { return '<div class="' + (i < n ? "on" : "") + '">' + (i < n ? "✓ " : (i + 1) + ". ") + l + "</div>"; }).join("") + "</div>";
    }
    document.getElementById("pay-zone").innerHTML = ""; draw();
    var iv = setInterval(function () { n++; draw(); if (n >= 4) { clearInterval(iv); SLSD.cart.clear(); document.getElementById("pay-zone").innerHTML = '<p class="note">Simulation terminée.</p>'; } }, 1300);
  });
}
render();
</script>
</body>
</html>
