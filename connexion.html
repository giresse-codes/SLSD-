<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — SLSD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<main class="w"><div class="box">
<h1>Connexion</h1>
<p class="mute" style="margin:0 0 18px">Content de vous revoir.</p>
<form id="f">
<label class="fld">E-mail<input id="em" type="email" required autocomplete="email"></label>
<label class="fld">Mot de passe<input id="pw" type="password" required minlength="6" autocomplete="current-password"></label>
<button class="btn p lg" type="submit" style="width:100%">Se connecter</button>
<p class="note err" id="msg"></p>
</form>
<p class="note">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
</div></main>
<div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
SLSD.layout("");
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var msg = document.getElementById("msg"); msg.textContent = "";
  SLSD.auth.signIn(document.getElementById("em").value.trim(), document.getElementById("pw").value)
    .then(function () { location.href = SLSD.safeNext(SLSD.param("next")); })
    .catch(function (err) { msg.textContent = err.message || "Connexion impossible."; });
});
</script>
</body>
</html>
